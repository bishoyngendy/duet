# Generated by scripts/build.mjs from packaging/commands.json. Do not edit.
schema_version: "1.0"
extension:
  id: duetto
  name: "Duetto (Claude + Codex)"
  version: "0.1.0"
  description: "Every Spec Kit phase run by both Claude and Codex: independent research, plans, rebuttals and cross-review"
  author: "Bishoy Gendy"
  repository: "https://github.com/bishoyngendy/duetto"
  license: MIT
requires:
  speckit_version: ">=1.0.0"
  tools:
    - name: node
      required: true
    - name: claude
      required: true
    - name: codex
      required: true
provides:
  commands:
    - name: speckit.duetto.specify
      file: commands/speckit.duetto.specify.md
      description: "Start a feature: Claude and Codex research the codebase independently, then a spec draft is written in Spec Kit's format."
    - name: speckit.duetto.clarify
      file: commands/speckit.duetto.clarify.md
      description: "Claude and Codex each question the spec draft; you answer the merged questions and the spec is revised with your answers."
    - name: speckit.duetto.plan
      file: commands/speckit.duetto.plan.md
      description: "Claude and Codex write independent plans, rebut each other's, the plans are merged (real disagreements come to you), then both attack the merged plan."
    - name: speckit.duetto.tasks
      file: commands/speckit.duetto.tasks.md
      description: "Break the plan into a Spec Kit tasks.md; tasks marked [P] are independent and will be implemented concurrently."
    - name: speckit.duetto.analyze
      file: commands/speckit.duetto.analyze.md
      description: "Claude and Codex each audit spec, plan and tasks for gaps, ambiguity, coverage and constitution conflicts before any code is written."
    - name: speckit.duetto.implement
      file: commands/speckit.duetto.implement.md
      description: "Implement every task: one model implements, the project's checks run, the other model reviews, until approved; tasks alternate between Claude and Codex."
    - name: speckit.duetto.converge
      file: commands/speckit.duetto.converge.md
      description: "Audit the whole feature against its spec; unmet criteria become fix tasks (with your go-ahead), then a report is written."
  scripts:
    - name: duetto
      file: scripts/bash/duetto.sh
      description: "Runs the Duetto engine installed with the duetto plugin"
      runtimes: [bash]
hooks:
  after_tasks:
    command: speckit.duetto.analyze
    optional: true
    prompt: "Have Claude and Codex both audit spec, plan and tasks (duetto analyze)?"
    description: "Dual-model consistency analysis"
tags: [multi-agent, claude, codex, review]
